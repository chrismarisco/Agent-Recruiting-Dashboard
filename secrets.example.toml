# Realty Metrics - Dashboard Configuration
# Copy this file to .streamlit/secrets.toml and fill in your values.
#
#   mkdir -p .streamlit
#   cp secrets.example.toml .streamlit/secrets.toml
#
# NEVER commit .streamlit/secrets.toml to version control.

# Dashboard login password
password = "YourSecurePasswordHere"

# Subscription tier: "starter", "professional", or "enterprise"
tier = "starter"

# Email report settings (required for Professional / Enterprise tier)
smtp_server = "smtp.gmail.com"
smtp_port = 587
sender_email = ""
sender_password = ""
